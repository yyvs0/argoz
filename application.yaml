apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-app
  namespace: argocd
spec:
  destination:
    namespace: yytest  # Hedef namespace belirttik
    server: https://kubernetes.default.svc
  source:
    repoURL: 'https://your-git-repo-url'
    targetRevision: HEAD
    path: '.'
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
